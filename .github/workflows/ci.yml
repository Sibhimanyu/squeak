name: CI

on:
  # Every branch: a break shows on push, not when ship.sh runs CI on the live checkout.
  push:
  pull_request:

jobs:
  ci:
    # The suite needs macOS: awake-backstop.test.ts runs the real backstop shell
    # and reads sysctl kern.bootsessionuuid, neither of which exists on Linux.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  mac:
    # Squeak for Mac's package tests. macos/scripts/test.sh fails when either runner (XCTest, Swift Testing) is red or
    # reports nothing, and prints one line: xctest=N/failed swift-testing=N/failed-runs.
    # The package needs a recent Swift (built locally with 6.4): the newest runner, and its newest Xcode.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - run: SQUEAK_TEST_LOG="$RUNNER_TEMP/mac-test.log" macos/scripts/test.sh
      # A hang or a crash: the last of the log says which test it was in.
      - if: failure() || cancelled()
        run: |
          log="$RUNNER_TEMP/mac-test.log"
          echo "--- started, never finished (a hang is one of these):"
          grep -oE 'Test [A-Za-z0-9_]+\(\) started' "$log" | sed 's/ started//' | sort -u > /tmp/started || true
          grep -oE 'Test [A-Za-z0-9_]+\(\) (passed|failed|skipped)' "$log" | sed -E 's/ (passed|failed|skipped)//' | sort -u > /tmp/done || true
          comm -23 /tmp/started /tmp/done
          grep -E "Test Case '.*' started" "$log" | sed -E "s/.*'(.*)' started.*/\1/" | sort -u > /tmp/xs || true
          grep -E "Test Case '.*' (passed|failed)" "$log" | sed -E "s/.*'(.*)' (passed|failed).*/\1/" | sort -u > /tmp/xd || true
          comm -23 /tmp/xs /tmp/xd
          echo "--- end of log:"
          tail -40 "$log" || true
