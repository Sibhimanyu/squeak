name: Squeak Voice add-on image

# Home Assistant pulls the add-on's prebuilt image (`image:` in homeassistant/squeak-voice/config.yaml) at the
# version in that file, so every version bump needs its image here first. Run it from the Actions tab
# (Run workflow) after merging a bump, or push a tag named addon-v<version>.
on:
  workflow_dispatch:
  push:
    tags: ["addon-v*"]

jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the add-on folder
        run: ./scripts/build-voice-addon.sh
      - name: Read the version
        id: version
        run: echo "value=$(sed -n 's/^version: "\(.*\)"/\1/p' homeassistant/squeak-voice/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dist-addon/squeak-voice
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/sibhimanyu/squeak-voice-${{ matrix.arch }}:${{ steps.version.outputs.value }}
            ghcr.io/sibhimanyu/squeak-voice-${{ matrix.arch }}:latest
