name: Squeak Voice
version: "0.11.7"
slug: squeak_voice
image: ghcr.io/sibhimanyu/squeak-voice-{arch}
description: Phones you when a coding agent waits on you, through your 3CX extension; Squeak on your Mac asks for each call through Firebase.
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# The Mac app's Update button. `manager` lets the add-on make the Supervisor re-read the add-on repositories
# (POST /store/reload), so a version published minutes ago is seen. The Supervisor refuses any add-on updating
# itself (403 "can't update itself", whatever the role), so the update is installed by Home Assistant Core's
# `update.install` service through the Core API proxy, which `homeassistant_api` opens (it acts as an administrator).
hassio_api: true
hassio_role: manager
homeassistant_api: true
# SIP and its audio (RTP) must reach the SBC on the LAN without NAT in between.
host_network: true
# The Squeak Voice panel in the sidebar: shows the pairing code and the add-on's state.
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-in-talk
panel_title: Squeak Voice
options:
  pairing_code: ""
  sip_host: ""
  sip_proxy: ""
  extension: ""
  auth_id: ""
  password: ""
  transport: udp
  speech: natural
schema:
  pairing_code: password?
  sip_host: str
  sip_proxy: str?
  extension: str
  auth_id: str?
  password: password
  transport: list(udp|tcp|tls)
  speech: list(natural|plain)?
